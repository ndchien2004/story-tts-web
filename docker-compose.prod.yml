# Toan bo he thong chay tren mot Droplet: MySQL, backend, va Caddy dung truoc
# lam cong vao kiem HTTPS. Dung `docker compose -f docker-compose.prod.yml`.
#
# Khac voi docker-compose.yml (chi dung khi lap trinh o may ca nhan): o day MySQL
# khong mo cong ra ngoai, chi backend trong cung mang noi bo goi duoc.
services:
  mysql:
    image: mysql:8.0
    container_name: story-tts-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Droplet nho nen phai ghi han muc bo nho dem; mac dinh 128M cong them phan
      # chi phi cua MySQL 8 la du de day JVM vao vung trao doi.
      - --innodb-buffer-pool-size=64M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-story_tts}
      MYSQL_USER: ${DB_USER:-storytts}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    build: ./backend
    container_name: story-tts-backend
    restart: unless-stopped
    # Doc phan con lai (JWT_SECRET, ELEVENLABS_API_KEY, CORS...) tu .env.
    env_file: .env
    # Nhung gia tri chi dung khi chay that, ghi de len .env: trong mang cua
    # Compose thi may chu co so du lieu ten la `mysql`, khong phai localhost.
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      SERVER_PORT: 8080
      AUDIO_DIR: /app/uploads/audio
      COVER_DIR: /app/uploads/covers
    volumes:
      - uploads:/app/uploads
    mem_limit: 640m
    depends_on:
      mysql:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: story-tts-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Chung chi nam trong volume nay. Mat no la moi lan dung lai phai xin lai
      # chung chi moi, ma Let's Encrypt co gioi han so lan cap moi tuan.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads:
  caddy_data:
  caddy_config:
