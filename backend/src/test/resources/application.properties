# Cấu hình riêng cho test: dùng H2 in-memory, không cần MySQL đang chạy.
spring.config.import=

spring.datasource.url=jdbc:h2:mem:storytts;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test dựng lược đồ từ entity chứ không chạy migration: các tệp trong
# db/migration viết bằng phương ngữ MySQL (engine=InnoDB, enum(...)) mà H2 không
# hiểu. Bù lại, đây cũng là điều khiến test không kiểm được rằng V1 khớp với
# entity — việc đó do `ddl-auto=validate` làm khi chạy thật trên MySQL.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Cung che do lay/nha ket noi voi ban chay that, va dong nay khong phai cho
# vui: no la cho da bat mot loi that.
#
# Truoc day tep nay khong co no, nen test chay voi mot cau hinh KHAC voi ban
# that. Hau qua cu the: SupportStore.append tung ghi
# @Transactional(isolation = READ_COMMITTED); toan bo test xanh, con ban that
# nem InvalidIsolationLevelException o MOI luot gui tin - vi Spring chi ap
# duoc muc co lap tuy chon khi che do nha ket noi la ON_CLOSE.
#
# Moi khoa cau hinh anh huong toi ranh gioi giao dich deu thuoc ve day. Tep
# nay THAY THE application.properties cua ban chinh (cung ten, dung truoc
# tren classpath) chu khong bo sung vao no, nen thieu mot khoa la test kiem
# mot he thong khac voi he thong duoc trien khai.
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

app.jwt.secret=test-secret-key-danh-rieng-cho-unit-test-du-32-byte
app.jwt.expiration-ms=3600000
app.jwt.issuer=story-tts-test

app.admin.username=admin
app.admin.email=admin@test.local
app.admin.password=Admin@123

app.cors.allowed-origins=http://localhost:5173

# Test không gọi ra ngoài mạng, nên nơi lưu luôn là hệ tệp cục bộ. Phần
# Cloudinary được kiểm bằng mock ở nơi gọi nó.
app.storage.driver=local
app.storage.audio-dir=./target/test-uploads/audio
app.storage.bgm-dir=./target/test-uploads/bgm

app.tts.enabled=false
app.tts.providers=elevenlabs
app.tts.default-speed=0
app.tts.elevenlabs.endpoint=https://api.elevenlabs.io/v1
app.tts.elevenlabs.api-key=
app.tts.elevenlabs.voice-id=
app.tts.elevenlabs.model-id=eleven_multilingual_v2

app.google.client-id=
app.google.certs-url=https://www.googleapis.com/oauth2/v3/certs

# Có host thì Spring Boot mới dựng JavaMailSender, nhưng để trống username nên
# MailService coi như chưa cấu hình: test không gửi thư đi đâu cả.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

app.mail.from=
app.mail.from-name=Truyen Nghe
app.mail.reset-url=http://localhost:5173/dat-lai-mat-khau
app.mail.reset-token-ttl-minutes=30

# Không sinh dữ liệu mẫu khi chạy test
app.seed.enabled=false

# ================= Gioi han tan suat =================
# Tat trong test: cac bai kiem o day goi thang vao service, khong di qua chuoi
# filter, nen hang rao nay khong anh huong gi - tru mot chuyen, no giu mot bang
# bam song suot ca lan chay. Hanh vi cua no duoc kiem rieng o RateLimitFilterTest,
# noi bo loc duoc dung tay voi cau hinh cua chinh bai kiem ay.
app.ratelimit.enabled=false

# Quang nghi ngan de bai kiem khong phai cho that.
app.login-throttle.max-failures=3
app.login-throttle.lock-for=1s

# ================= Hop thu ho tro =================
# Test khong doc application.properties cua ban chinh (tep nay dung ten va
# dung truoc tren classpath), nen moi khoa app.support.* phai co mat o day.
# Thieu mot khoa thi SupportProperties bind ra null/0 va loi chi lo ra luc
# chay, o mot bai kiem khong lien quan gi toi hop thu ho tro.
app.support.max-message-length=2000
app.support.history-page-size=50
app.support.sync-page-size=200
app.support.inbox-page-size=50
# Rong hon ban that: cac bai kiem dong thoi gui nhieu tin lien tiep tu nhieu
# luong, va chung dang kiem tinh dung dan chu khong kiem hang rao tan suat.
# Hanh vi cua hang rao duoc kiem rieng, o noi no duoc dung tay.
app.support.send-per-minute=0
app.support.max-sessions-per-user=5
app.support.max-sessions=400
app.support.heartbeat-interval=25s
app.support.idle-timeout=120s
app.support.session-max-lifetime=30m
