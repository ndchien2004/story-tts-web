# Cấu hình riêng cho test: dùng H2 in-memory, không cần MySQL đang chạy.
spring.config.import=

spring.datasource.url=jdbc:h2:mem:storytts;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-key-danh-rieng-cho-unit-test-du-32-byte
app.jwt.expiration-ms=3600000
app.jwt.issuer=story-tts-test

app.admin.username=admin
app.admin.email=admin@test.local
app.admin.password=Admin@123

app.cors.allowed-origins=http://localhost:5173

app.storage.audio-dir=./target/test-uploads/audio
app.storage.cover-dir=./target/test-uploads/covers

app.tts.enabled=false
app.tts.fptai.endpoint=https://api.fpt.ai/hmi/tts/v5
app.tts.fptai.api-key=
app.tts.fptai.default-voice=banmai
app.tts.fptai.default-speed=0

# Không sinh dữ liệu mẫu khi chạy test
app.seed.enabled=false
