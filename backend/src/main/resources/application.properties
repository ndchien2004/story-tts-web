spring.application.name=story-tts-backend

# Nap file .env o thu muc goc repo (neu co). Khong bat buoc -> optional.
# Nho vay API key / mat khau khong nam trong ma nguon.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

server.port=${SERVER_PORT:8080}

# ================= Datasource (MySQL) =================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:story_tts}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:storytts}
spring.datasource.password=${DB_PASSWORD:storytts}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / Hibernate =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.show-sql=false

# ================= JWT =================
app.jwt.secret=${JWT_SECRET:doi-chuoi-nay-thanh-secret-ngau-nhien-dai-it-nhat-32-ky-tu}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=story-tts

# ================= Tai khoan Admin khoi tao =================
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@storytts.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}

# ================= CORS =================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173}

# ================= Luu tru file =================
app.storage.audio-dir=${AUDIO_DIR:./uploads/audio}
app.storage.cover-dir=${COVER_DIR:./uploads/covers}
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB

# ================= TTS (FPT.AI) =================
app.tts.enabled=${TTS_ENABLED:true}
app.tts.fptai.endpoint=${FPT_TTS_ENDPOINT:https://api.fpt.ai/hmi/tts/v5}
app.tts.fptai.api-key=${FPT_TTS_API_KEY:}
app.tts.fptai.default-voice=${FPT_TTS_VOICE:banmai}
app.tts.fptai.default-speed=${FPT_TTS_SPEED:0}

# Fallback order. A provider with no API key is skipped automatically.
app.tts.providers=${TTS_PROVIDERS:fptai,elevenlabs}

app.tts.elevenlabs.endpoint=${ELEVENLABS_ENDPOINT:https://api.elevenlabs.io/v1}
app.tts.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
app.tts.elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:}
# Vietnamese needs a multilingual model; the monolingual ones mispronounce it.
app.tts.elevenlabs.model-id=${ELEVENLABS_MODEL_ID:eleven_multilingual_v2}

# ================= Seed du lieu mau =================
app.seed.enabled=${SEED_ENABLED:true}

# ================= Swagger UI =================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ================= Logging =================
logging.level.com.storytts.backend=INFO
