spring.application.name=story-tts-backend

# Nap file .env o thu muc goc repo (neu co). Khong bat buoc -> optional.
# Nho vay API key / mat khau khong nam trong ma nguon.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Các nền tảng cho thuê máy chủ (Render, Railway, Heroku) tự chọn cổng rồi báo
# lại qua PORT, và chỉ chuyển tiếp lưu lượng vào đúng cổng ấy. Nghe theo PORT
# trước là để khỏi phải nhớ đặt lại SERVER_PORT mỗi lần đổi nơi triển khai.
server.port=${PORT:${SERVER_PORT:8080}}

# Mặc định của Tomcat là 200 luồng, dựng cho máy chủ nhiều nhân nhiều RAM. Mỗi
# luồng giữ một ngăn xếp riêng, nên trên hộp 512MB chỗ ấy đủ để đẩy tiến trình
# qua trần bộ nhớ. Hai mươi luồng vẫn thừa cho một bản demo, và cũng vừa đúng
# với số kết nối cơ sở dữ liệu đang cho phép - mở nhiều luồng hơn số kết nối
# thì phần dư chỉ đứng xếp hàng chờ.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}

# Nén phản hồi. Trước đây không đáng kể vì phản hồi JSON nào cũng nhỏ. Mốc thời
# gian từng chữ thì khác: một chương dài ra vài trăm KB JSON, và đó là thứ trang
# đọc tải ngay khi mở chương. Nén lại còn chừng một phần năm, đổi bằng một lần
# gzip trên máy chủ.
#
# File audio không nằm trong danh sách kiểu dưới đây, và không nên nằm: MP3 đã
# nén rồi, gzip thêm lượt nữa chỉ tốn CPU mà không bớt được byte nào.
server.compression.enabled=${SERVER_COMPRESSION:true}
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript
server.compression.min-response-size=2KB

# ================= Datasource (MySQL) =================
# Hai tham số cuối là chỗ khác nhau giữa MySQL chạy trong Docker ở máy mình và
# MySQL đi thuê. Mặc định giữ nguyên nếp cũ để `docker compose up` không phải
# sửa gì; nhà cung cấp nào bắt buộc mã hoá đường truyền thì đặt DB_SSL_MODE.
#
# DB_CREATE_IF_MISSING: tài khoản của dịch vụ đi thuê thường không được phép
# tạo cơ sở dữ liệu mới - họ cấp sẵn một cái. Đặt false để trình điều khiển
# đừng gửi câu lệnh tạo ấy, vì nó bị từ chối ngay lúc mở kết nối.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:story_tts}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&sslMode=${DB_SSL_MODE:DISABLED}&createDatabaseIfNotExist=${DB_CREATE_IF_MISSING:true}
spring.datasource.username=${DB_USER:storytts}
spring.datasource.password=${DB_PASSWORD:storytts}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Gói miễn phí của các dịch vụ cho thuê chỉ mở vài chục kết nối cho toàn bộ
# tài khoản, mà mặc định của Hikari là mười. Hạ xuống để còn chỗ cho công cụ
# quản trị vào xem cơ sở dữ liệu trong lúc ứng dụng vẫn đang chạy.
#
# Con số này cố ý không được nâng lên. Khi pool cạn, câu hỏi đúng là "giao dịch
# nào đang giữ kết nối lâu thế" chứ không phải "sao pool bé thế": mười kết nối
# thừa sức cho hai mươi luồng Tomcat nếu giao dịch nào cũng chỉ sống vài mili
# giây. Nâng pool để che một giao dịch dài chỉ dời thời điểm cạn đi một chút, và
# đổi lấy việc mất luôn dấu hiệu để tìm ra nó.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Kết nối bị giữ quá lâu thì ghi lại vết gọi đã lấy nó ra.
#
# Đây là thứ trước đây không có, và là lý do một giao dịch dài chỉ hiện ra dưới
# dạng "Connection is not available" ở một request khác hẳn — báo đúng nạn nhân,
# không báo thủ phạm. Hai mươi giây là ngưỡng của sự vô lý: sau đợt sửa này,
# giao dịch dài nhất còn lại chỉ gồm vài câu lệnh SQL. Không phải lỗi, chỉ là
# một dòng cảnh báo kèm ngăn xếp, và Hikari không tính phí gì thêm cho nó khi
# ngưỡng chưa bị chạm. Đặt 0 để tắt.
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:20000}

# Tên hiện trong log của Hikari. Mặc định là "HikariPool-1", không nói được gì
# khi đọc log lẫn với các dịch vụ khác.
spring.datasource.hikari.pool-name=story-tts-pool

# ================= JPA / Hibernate =================
# Lược đồ do Flyway dựng (xem db/migration), Hibernate chỉ được phép đối chiếu.
# `validate` là chỗ phát hiện lệch: thêm một trường vào entity mà quên viết
# migration thì ứng dụng báo lỗi ngay lúc khởi động, thay vì `update` tự lặng lẽ
# sửa bảng và để mỗi máy một lược đồ khác nhau.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.show-sql=false

# Kết nối được lấy khỏi pool ở câu lệnh SQL đầu tiên, không phải lúc giao dịch
# mở ra, và được trả lại khi giao dịch đóng.
#
# Đây vốn là mặc định của Hibernate khi không dùng JTA, nhưng vài chỗ trong mã
# nguồn dựa hẳn vào nó: chúng cố ý ghi file hoặc gọi dịch vụ ngoài ở đầu một
# method có @Transactional, trước mọi câu lệnh SQL, nên quãng chờ ấy không cầm
# kết nối nào (xem AudioService.uploadForChapter và BgmService.upload). Viết
# thẳng ra đây để điều đó là một lựa chọn đọc được, chứ không phải một mặc định
# may mà đúng.
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

# ================= Flyway (migration luoc do) =================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Co so du lieu da co san tu thoi ddl-auto=update: danh dau la da o V1 roi bo
# qua tep baseline, chi chay cac migration moi hon. Neu luoc do cu that su lech
# voi V1 thi ddl-auto=validate se bao ngay luc khoi dong.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Luoc do dung boi ddl-auto truoc khi co Flyway

# ================= JWT =================
app.jwt.secret=${JWT_SECRET:doi-chuoi-nay-thanh-secret-ngau-nhien-dai-it-nhat-32-ky-tu}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=story-tts

# ================= Tai khoan Admin khoi tao =================
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@storytts.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}

# ================= CORS =================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173}

# ================= Luu tru file =================
# Noi luu audio chuong va nhac nen.
#
#   local       - he tep cua chinh may dang chay. Mac dinh, va la lua chon dung
#                 khi lap trinh o may ca nhan hoac khi may chu co dia rieng.
#   cloudinary  - cung tai khoan dang dung cho anh dai dien.
#
# BAT BUOC dat STORAGE_DRIVER=cloudinary khi chay tren nen tang co he tep tam
# thoi. Render goi mien phi la mot trong so do: file bi xoa sach moi lan trien
# khai lai, moi lan khoi dong lai, va moi lan dich vu ngu sau 15 phut vang
# khach. De `local` o do nghia la moi ban audio dung bang ElevenLabs - mat tien
# that cho tung ban - deu bien mat trong vong mot gio, trong khi hang trong co
# so du lieu van ghi la READY.
app.storage.driver=${STORAGE_DRIVER:local}

# Hai duong dan duoi chi co nghia khi driver=local.
app.storage.audio-dir=${AUDIO_DIR:./uploads/audio}
# Nhac nen quan tri vien tai len. Thu muc rieng chu khong chung voi audio
# chuong: audio chuong la du lieu dung lai duoc, nhac nen thi khong.
app.storage.bgm-dir=${BGM_DIR:./uploads/bgm}

# Giu mot ban audio da loi thoi bao lau truoc khi xoa file cua no.
#
# Ban audio thanh loi thoi ngay luc Admin sua noi dung chuong, nhung file thi
# khong bi xoa ngay: rat co the dang co nguoi nghe do dung file ay, va trang doc
# co y khong cat ngang ho - ho nhan mot loi bao kem nut "Doc noi dung moi" va tu
# chon luc nao thi chuyen. Ba ngay la khoang du rong cho viec do, va cung du de
# mot lan sua nham con kip hoan tac. Dat 0 de tat han viec don.
app.storage.stale-retention-hours=${AUDIO_STALE_RETENTION_HOURS:72}

# Ha tu 64MB. Khi audio luu o Cloudinary, noi dung file buoc phai nam tron
# trong heap de dung request co chu ky, ma heap o day la 224MB. Chuong audio
# that do duoc nam trong khoang 40KB den 8MB. Xem AudioService.MAX_UPLOAD_BYTES.
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=32MB

# ================= Tao audio (ElevenLabs) =================
app.tts.enabled=${TTS_ENABLED:true}

# Thu tu thu cac nha cung cap. Cai nao chua co API key thi tu dong bi bo qua.
app.tts.providers=${TTS_PROVIDERS:elevenlabs}

# Chi con la mot phan khoa cache: ElevenLabs khong nhan tham so toc do.
app.tts.default-speed=${TTS_DEFAULT_SPEED:0}

# ----- Nut "Nghe bang AI" cua nguoi doc (muc 4.5) -----
# Nguoi doc tu bam tao audio la yeu cau cua de bai, nhung moi ban dung moi la mot
# lan goi API tinh tien, nen duong nay co ngan sach. Ha mot con so o day la siet
# lai duoc ngay, khong phai sua code. Ban da co thi nghe lai khong ton luot nao.
#
# Tat han duong nguoi doc; khu quan tri van dung audio binh thuong.
app.tts.reader.enabled=${TTS_READER_ENABLED:true}
# So ban audio moi mot nguoi duoc tao trong ngay. -1 = khong gioi han, 0 = chan han.
app.tts.reader.daily-quota=${TTS_READER_DAILY_QUOTA:3}
app.tts.reader.daily-quota-vip=${TTS_READER_DAILY_QUOTA_VIP:10}
# Tran chung cho toan bo nguoi doc trong ngay - cau dao cuoi ve chi phi.
app.tts.reader.daily-quota-global=${TTS_READER_DAILY_QUOTA_GLOBAL:100}
# Mot chuong bi cat thanh nhieu lan goi nha cung cap (4500 ky tu moi lan), nen day
# moi la can chi phi that: 20000 ky tu ~ 5 lan goi cho mot ban audio.
app.tts.reader.max-chars=${TTS_READER_MAX_CHARS:20000}

app.tts.elevenlabs.endpoint=${ELEVENLABS_ENDPOINT:https://api.elevenlabs.io/v1}
app.tts.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
app.tts.elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:}
# Vietnamese needs a multilingual model; the monolingual ones mispronounce it.
app.tts.elevenlabs.model-id=${ELEVENLABS_MODEL_ID:eleven_multilingual_v2}

# ================= Tro ly AI doc truyen (Google Gemini) =================
# Hop chat nho o goc duoi trang doc: tom tat chuong dang doc, tra loi cau hoi
# ve no. De trong GEMINI_API_KEY thi tinh nang tu tat va trang doc khong ve
# gi ca - phan con lai cua web chay binh thuong.
app.ai.enabled=${AI_ASSISTANT_ENABLED:true}

# So cau hoi moi nguoi duoc gui trong ngay. -1 = khong gioi han, 0 = chan han.
# Moi cau hoi la mot lan goi API tinh tien, va no gui kem ca noi dung chuong,
# nen day la cho siet chi phi. Ha mot con so o day la siet duoc ngay.
app.ai.daily-quota=${AI_DAILY_QUOTA:20}
app.ai.daily-quota-vip=${AI_DAILY_QUOTA_VIP:50}
# Tran chung cho toan bo nguoi doc trong ngay - cau dao cuoi ve chi phi.
app.ai.daily-quota-global=${AI_DAILY_QUOTA_GLOBAL:500}

# Phan noi dung chuong toi da duoc dua vao mot loi goi. Chuong dai hon thi bi
# cat: giu sau phan dau va bon phan cuoi (xem AssistantPrompt.fit). Day la
# hang rao CHI PHI chu khong phai hang rao ky thuat - cua so ngu canh cua model
# rong hon han con so nay.
app.ai.max-chapter-chars=${AI_MAX_CHAPTER_CHARS:24000}
# Tran do dai mot cau hoi.
app.ai.max-question-chars=${AI_MAX_QUESTION_CHARS:500}
# So luot hoi dap cu duoc gui kem de tro ly hieu cau hoi noi tiep. 0 = hoi dap
# mot luot, khong nho gi. Cang cao cang ton token moi luot.
app.ai.max-history-turns=${AI_MAX_HISTORY_TURNS:6}

# Goc cua API, khong kem ten model - model duoc ghep vao duong dan luc goi.
app.ai.gemini.endpoint=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
# Cho toi day thi bo, khong treo luong Tomcat. 20 luong Tomcat la tat ca nhung
# gi may chu nay co (xem server.tomcat.threads.max o tren), nen mot loi goi
# treo vo han la mot luong mat han.
app.ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}
# Tran do dai cau tra loi. Vua la tran chi phi, vua la thu giu cho cau tra loi
# con vua mot hop chat nho.
app.ai.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1024}

# ================= Cloudinary (anh dai dien) =================
# De trong cloud-name/api-key/api-secret thi tinh nang doi anh dai dien tu tat,
# phan con lai cua ung dung khong bi anh huong.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:story-tts-web}
# Anh dai dien nho, khong can cho phep file lon nhu audio.
app.cloudinary.max-avatar-bytes=${CLOUDINARY_MAX_AVATAR_BYTES:5242880}

# ================= PayOS (thanh toan nang cap VIP) =================
# De trong client-id/api-key/checksum-key thi chuc nang thanh toan tu tat:
# API van tra ve danh sach goi nhung tu choi tao don, phan con lai chay binh thuong.
app.payos.endpoint=${PAYOS_ENDPOINT:https://api-merchant.payos.vn}
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
# Noi PayOS dua nguoi dung quay lai sau khi tra tien (hoac bam huy).
app.payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/thanh-toan/ket-qua}
app.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/thanh-toan/ket-qua}
# Don chua tra qua han nay thi coi nhu bo, PayOS cung tu dong huy link.
app.payos.order-timeout-minutes=${PAYOS_ORDER_TIMEOUT_MINUTES:30}

# ================= Dang nhap bang Google =================
# De trong client-id thi nut "Dang nhap bang Google" tu an khoi giao dien.
# Luong dung o day la ID token, khong can client secret.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.certs-url=${GOOGLE_CERTS_URL:https://www.googleapis.com/oauth2/v3/certs}

# ================= Email (quen mat khau) =================
# De trong username/password thi chuc nang quen mat khau tu tat, phan con lai
# cua ung dung khong bi anh huong.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Truyen Nghe}
# Trang dat lai mat khau cua frontend; token duoc noi vao sau dia chi nay.
app.mail.reset-url=${MAIL_RESET_URL:http://localhost:5173/dat-lai-mat-khau}
app.mail.reset-token-ttl-minutes=${MAIL_RESET_TOKEN_TTL_MINUTES:30}

# ================= Seed du lieu mau =================
app.seed.enabled=${SEED_ENABLED:true}
# Luot doc/nghe mau dung cho bang xep hang trang chu.
#   auto   - chi dung khi bang view_events con rong (mac dinh)
#   append - chen them mot dot nua vao co so du lieu da co san lich su.
#            Dung dung mot lan roi tra ve auto: de nguyen thi moi lan khoi dong
#            lai la them mot dot. Khong xoa gi, luot truy cap that van duoc giu.
#   never  - khong dung
app.seed.traffic=${SEED_TRAFFIC:auto}

# ================= Swagger UI =================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ================= Health check =================
# SecurityConfig mo /actuator/health cho ca nguoi chua dang nhap, va nen trien
# khai dung duong nay de biet ban moi da song chua. Truoc day duong ay tra 404
# vi thieu han thu vien actuator - mot cong kiem tra luon bao "khong tim thay"
# la mot cong khong kiem gi ca.
#
# Chi mo dung `health`. Cac endpoint khac cua actuator (env, beans, configprops,
# heapdump) doc duoc bien moi truong, tuc doc duoc ca API key lan mat khau co so
# du lieu, nen chung khong duoc phep xuat hien.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Khong de suc khoe co so du lieu keo ca dich vu xuong UNHEALTHY: Aiven goi mien
# phi co the ngu, va lam nen tang khoi dong lai ung dung vi mot truy van cham la
# doi mot su co nho lay mot su co lon.
management.endpoint.health.group.liveness.include=ping

# ================= Logging =================
logging.level.com.storytts.backend=INFO
